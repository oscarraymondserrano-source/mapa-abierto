<title>Centro de Publicación Mapa Abierto</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@600;700&display=swap">
<style>
/* Layout: cabecera con cuenta atrás en directo → pestañas (Maratón · Agenda · Semana) → contenido. Estética de marca: noche + neón, una sola apariencia oscura. */
:root {
  color-scheme: dark;
  --bg: #0b0f2a; --panel: #141a3d; --panel-2: #1c2352; --line: #2c3570;
  --fg: #eef0ff; --muted: #a3a9d6;
  --yt: #ff2e88; --tt: #22d3ee; --yellow: #ffd666; --done: #4ade80;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-disp: "Space Grotesk", "Inter", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 56px; }
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding-block: 18px 0; }
.brand b { font: italic 800 1.35rem var(--f-body); }
.brand b span { color: var(--yt); text-shadow: 0 0 12px color-mix(in srgb, var(--yt) 55%, transparent); }
.brand small { font: 500 .75rem var(--f-mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }

/* HERO: cuenta atrás */
.hero { position: relative; overflow: hidden; border-radius: 22px; padding: 22px; border: 1px solid var(--line);
  background: radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--yt) 28%, transparent), transparent 55%),
              radial-gradient(90% 120% at 0% 100%, color-mix(in srgb, var(--tt) 18%, transparent), transparent 60%), var(--panel);
  display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; align-items: center; }
.hero h1 { margin: 0; font: 700 clamp(1.3rem, 3vw, 1.8rem)/1.2 var(--f-disp); text-wrap: balance; }
.hero .eyebrow { font: 700 .72rem var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--yellow); }
.hero p { margin: 6px 0 0; color: var(--muted); }
.clock { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.clock div { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; min-width: 74px; text-align: center; }
.clock b { display: block; font: 700 2rem/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.clock span { font: 500 .68rem var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.stat b { font: 700 1.5rem var(--f-mono); font-variant-numeric: tabular-nums; }
.stat span { display: block; color: var(--muted); font-size: .82rem; }
.ring { height: 6px; background: var(--panel-2); border-radius: 99px; overflow: hidden; margin-top: 8px; }
.ring i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--yt), var(--tt)); transition: width .3s; }

/* Pestañas y filtros */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tabs button { font: 600 .92rem var(--f-body); color: var(--muted); background: none; border: 0; padding: 10px 14px; cursor: pointer; border-bottom: 3px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--yt); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters .lbl { font: 700 .7rem var(--f-mono); color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin-right: 2px; }
.pill { font: 600 .8rem var(--f-body); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; cursor: pointer; }
.pill[aria-pressed="true"] { background: var(--panel-2); border-color: var(--fg); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.dot.yt { background: var(--yt); } .dot.tt { background: var(--tt); }

/* Maratón */
.marathon { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 22px; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 22px; }
.marathon img { width: 100%; border-radius: 14px; border: 1px solid var(--line); display: block; }
.mhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tag { font: 600 .75rem var(--f-mono); padding: 4px 10px; border-radius: 99px; background: var(--panel-2); white-space: nowrap; }
.tag.yt { background: color-mix(in srgb, var(--yt) 30%, var(--panel-2)); } .tag.tt { background: color-mix(in srgb, var(--tt) 25%, var(--panel-2)); color: var(--fg); }
.mbody { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.mtitle { font: 700 1.25rem/1.3 var(--f-disp); margin: 0; overflow-wrap: anywhere; }
.when { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.when div { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.when span { display: block; font: 600 .7rem var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.when b { font: 700 1.15rem var(--f-mono); }
.file { font: 500 .82rem var(--f-mono); color: var(--muted); overflow-wrap: anywhere; }
.file b { color: var(--fg); font-weight: 500; }
.acts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.copy { font: 600 .88rem var(--f-body); color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; cursor: pointer; text-align: left; display: flex; gap: 10px; align-items: center; }
.copy kbd { font: 700 .72rem var(--f-mono); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; color: var(--muted); }
.copy:hover { border-color: var(--tt); }
.copy.ok { border-color: var(--done); color: var(--done); }
.nav { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
.btn { font: 700 .95rem var(--f-body); border-radius: 12px; padding: 12px 18px; cursor: pointer; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); }
.btn.primary { background: linear-gradient(90deg, var(--yt), color-mix(in srgb, var(--yt) 60%, var(--tt))); border-color: transparent; color: #fff; }
.btn.primary.isdone { background: var(--done); color: var(--bg); }
details.preview summary { cursor: pointer; color: var(--muted); font-size: .85rem; }
details.preview pre { white-space: pre-wrap; overflow-wrap: anywhere; font: .82rem/1.5 var(--f-body); color: var(--muted); background: var(--bg); border-radius: 12px; padding: 12px; margin: 8px 0 0; }
.fallback { width: 100%; min-height: 80px; font: .8rem var(--f-mono); background: var(--bg); color: var(--fg); border: 1px solid var(--yellow); border-radius: 10px; padding: 8px; }
.hint { color: var(--muted); font-size: .82rem; }

/* Agenda */
.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.day { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.day h3 { margin: 0 0 4px; font: 700 .8rem var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--yellow); }
.slot { display: grid; grid-template-columns: 52px 10px minmax(0, 1fr) 22px; gap: 8px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; cursor: pointer; text-align: left; color: var(--fg); font: inherit; width: 100%; }
.slot:hover { border-color: var(--fg); }
.slot time { font: 700 .82rem var(--f-mono); font-variant-numeric: tabular-nums; }
.slot .t { font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .st { font-size: .9rem; text-align: right; }
.slot.done { opacity: .5; }
.slot.past .t::after { content: " · ya pasó"; color: var(--yellow); }

/* Semana: mapa de calor */
.heat { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.heat table { border-collapse: separate; border-spacing: 3px; font: 500 .72rem var(--f-mono); min-width: 640px; }
.heat th { color: var(--muted); font-weight: 500; padding: 2px 4px; text-align: center; }
.heat th.d { text-align: left; color: var(--fg); white-space: nowrap; padding-right: 10px; }
.heat td { width: 34px; height: 30px; border-radius: 6px; text-align: center; color: var(--bg); font-weight: 700; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: .82rem; margin-top: 10px; align-items: center; }
.why { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.why div { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; color: var(--muted); font-size: .88rem; }
.why b { color: var(--fg); display: block; font-family: var(--f-disp); font-size: 1rem; margin-bottom: 4px; }
.series { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.series div { border-radius: 14px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); }
.series b { font: 700 .95rem var(--f-disp); } .series span { display: block; color: var(--muted); font-size: .82rem; }
button:focus-visible, .slot:focus-visible { outline: 2px solid var(--tt); outline-offset: 2px; }
@media (max-width: 720px) {
  .hero { grid-template-columns: 1fr; } .clock { justify-content: flex-start; }
  .marathon { grid-template-columns: 1fr; } .marathon img { max-width: 170px; }
  .stats { grid-template-columns: 1fr 1fr 1fr; } .stat b { font-size: 1.2rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

let filt = { plat: "all", state: "pend" };

function copyBtn(n, label, text, holder) {

function doCopy(b, label, text, holder) {
  const ok = () => { b.classList.add("ok"); b.querySelector("span").textContent = "Copiado ✓"; setTimeout(() => { b.classList.remove("ok"); b.querySelector("span").textContent = label; }, 1500); };

  let s = Math.max(0, Math.floor((ts(p) - now) / 1000));
  const parts = [["días", Math.floor(s / 86400)], ["horas", Math.floor(s % 86400 / 3600)], ["min", Math.floor(s % 3600 / 60)], ["seg", s % 60]];
  clock.innerHTML = parts.filter((x, i) => i > 0 || x[1] > 0).map(x => `<div><b>${String(x[1]).padStart(2, "0")}</b><span>${x[0]}</span></div>`).join("");
}

function syncPills() {
  document.querySelectorAll(".pill").forEach(b => b.setAttribute("aria-pressed", String(filt[b.dataset.f] === b.dataset.v)));
}
function show(tab) {
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  for (const t of ["maraton", "agenda", "semana"]) $("#tab-" + t).hidden = t !== tab;
  $("#filters").hidden = tab === "semana";
  renderAll();
}
function renderAll() { stats(); renderMarathon(); renderAgenda(); renderWeek(); hero(); }

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => show(b.dataset.tab));
document.querySelectorAll(".pill").forEach(b => b.onclick = () => { filt[b.dataset.f] = b.dataset.v; idx = 0; syncPills(); renderAll(); });
document.addEventListener("keydown", e => {
  if ($("#tab-maraton").hidden || e.target.tagName === "TEXTAREA") return;
  const list = visible(); const p = list[idx]; if (!p) return;
  if (/^[1-9]$/.test(e.key)) { const b = document.querySelector(`.copy[data-k="${e.key}"]`); if (b) b.click(); }
  else if (e.key === "Enter") { e.preventDefault(); toggle(p, true); }
  else if (e.key === "ArrowRight") { idx++; renderMarathon(); }
  else if (e.key === "ArrowLeft") { idx--; renderMarathon(); }
});
renderAll();
setInterval(hero, 1000);
</script>
